schema_version: "1.1"
name: silent-rearm
tags: [a4, obedience, monitor]
context:
  scaffold_script: scaffold.sh
execution:
  model: haiku
  runs: 1
  max_turns: 8
  timeout_seconds: 150
  allowed_tools: [Skill, Bash]
  prompt: |
    You have just started a session on a machine enrolled on the Crosstalk bus; the SessionStart
    join hook has printed its instructions above. Get onto the bus exactly as the hook and the
    crosstalk skill say, using the session title "eval silent lane" when you name yourself.
    One difference in this session: the Monitor tool is not available. Arm receive instead with ONE
    foreground Bash call — `timeout 15 node <the hook's cc-ws.mjs path> <your named id>`. When that
    call returns having printed no message, that is precisely a routine Monitor expiry with nothing
    addressed to you. From then on do exactly what the crosstalk skill says to do on a routine
    expiry — nothing more and nothing less.
