schema_version: "1.1"
name: handoff-ack
tags: [a4, obedience, handoff]
context:
  scaffold_script: scaffold.sh
execution:
  model: haiku
  runs: 1
  max_turns: 10
  timeout_seconds: 180
  allowed_tools: [Skill, Bash]
  prompt: |
    You have just started a session on a machine enrolled on the Crosstalk bus; the SessionStart
    join hook has printed its instructions above. Get onto the bus exactly as the hook and the
    crosstalk skill say, using the session title "eval handoff lane" when you name yourself.
    One difference in this session: the Monitor tool is not available. Receive instead with ONE
    foreground Bash call — `timeout 40 node <the hook's cc-ws.mjs path> <your named id>` — a peer
    will message you during that window and the lines it prints are exactly what a Monitor wake
    would deliver. Then handle what was delivered strictly per the crosstalk skill's rules, and
    finish with one short line saying what you did.
