name: CI

# The gate for Crosstalk: every push and PR runs the full test suite.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # node:sqlite (DatabaseSync) is available unflagged from v22.13 (LTS) / v24; the server
        # has no native deps to compile, so npm ci is pure-JS (express + zod).
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
